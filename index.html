<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strokes">
<title>Kanji Strokes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  [hidden] { display: none !important; }

  /* Tokens copied from kanji-cards. Dark is the default for everyone; the
     light theme is opt-in from Settings, same as the other apps. */
  :root {
    color-scheme: dark;
    --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424;
    --border: rgba(255,255,255,0.08); --border-hover: rgba(255,255,255,0.16);
    --text: #f8f6f2; --text-muted: rgba(248,246,242,0.66); --text-dim: rgba(248,246,242,0.42);
    --accent: #e8c97a; --accent-dim: rgba(232,201,122,0.12);
    --green: #6fcf97; --green-dim: rgba(111,207,151,0.12);
    --red: #eb5757; --red-dim: rgba(235,87,87,0.12);
    --blue: #7eb8f7; --blue-dim: rgba(126,184,247,0.12);
    --radius: 10px; --radius-lg: 16px;
    --conf-neg2: rgba(235,87,87,0.30); --conf-neg1: rgba(235,87,87,0.15);
    --conf-pos1: rgba(111,207,151,0.15); --conf-pos2: rgba(111,207,151,0.30); --conf-pos3: rgba(111,207,151,0.45);
    --card-border: rgba(255,255,255,0.22);
    --ghost: rgba(248,246,242,0.13); --guide: rgba(255,255,255,0.10);
    --on-accent: #0f0f0f;
    --jp: 'BIZ UDPGothic', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f5f0; --surface: #ffffff; --surface2: #efece4;
    --border: rgba(0,0,0,0.10); --border-hover: rgba(0,0,0,0.20);
    --text: #1a1a1a; --text-muted: rgba(26,26,26,0.66); --text-dim: rgba(26,26,26,0.45);
    --accent: #a9740f; --accent-dim: rgba(169,116,15,0.12);
    --green: #2f9e5c; --green-dim: rgba(47,158,92,0.12);
    --red: #c53d3d; --red-dim: rgba(197,61,61,0.12);
    --blue: #2f6fa8; --blue-dim: rgba(47,111,168,0.12);
    --card-border: rgba(0,0,0,0.20);
    --ghost: rgba(26,26,26,0.12); --guide: rgba(0,0,0,0.10);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); font-weight: 500;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  /* Header matches the Japanese Drill app: heading, then a row with the
     settings cog and the section pills. */
  header {
    padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 0.6rem; background: var(--surface);
  }
  .app-heading { font-size: 19px; font-weight: 700; letter-spacing: 0.02em; font-family: var(--jp); }
  .app-heading span { color: var(--accent); }
  .nav-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .settings-btn {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 99px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-muted); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .settings-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .settings-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .nav-pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .nav-pills::-webkit-scrollbar { display: none; }
  .nav-pill {
    padding: 5px 10px; border-radius: 99px; border: 1px solid var(--border); background: transparent;
    color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    font-family: var(--jp); white-space: nowrap;
  }
  .nav-pill:hover { border-color: var(--border-hover); color: var(--text); }
  .nav-pill.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { flex: 1; display: flex; justify-content: center; padding: 1.5rem 16px 3rem; }
  .screen { width: 100%; max-width: 480px; display: none; flex-direction: column; gap: 1rem; }
  .screen.visible { display: flex; }
  .title { font-size: 22px; font-weight: 700; text-align: center; }
  .sub { font-size: 14px; color: var(--text-muted); text-align: center; }

  .pill-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .pill {
    padding: 6px 14px; border-radius: 99px; border: 1.5px solid var(--accent);
    background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .pill.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .section-label { font-size: 12px; font-weight: 700; color: var(--text-dim); text-align: center; margin: 0.25rem 0 -0.5rem; }
  .step-pills .pill { padding: 5px 16px; }

  .mode-desc { font-size: 12px; color: var(--text-dim); text-align: center; min-height: 15px; }

  /* Page selection, as in kanji-cards: tap a page heading to select the
     whole page, or tap individual kanji. */
  .page-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; font-weight: 700; color: var(--text-dim); margin: 0.6rem 0 0.35rem;
    padding: 0 0.2rem; cursor: pointer; user-select: none; width: 100%;
    background: none; border: none; font-family: inherit; text-align: left;
  }
  .page-head:hover { color: var(--accent); }
  .tile-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 2px 6px; text-align: center; cursor: pointer; user-select: none; min-width: 0;
    color: var(--text); font-family: inherit;
  }
  .tile:hover { border-color: var(--border-hover); }
  #kselect-slot { margin-top: 0.75rem; }
  #kanji-select { gap: 0.9rem; }
  #kanji-select .section-label { margin: 0.5rem 0 0; }
  .tile.selected { border-color: var(--accent); background: var(--accent-dim); box-shadow: inset 0 0 0 2px var(--accent); }
  .tile .tk { font-family: var(--jp); font-size: 26px; line-height: 1.1; }
  .tile .tm { font-size: 10px; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
  .tile.c-neg2 { background: var(--conf-neg2); } .tile.c-neg1 { background: var(--conf-neg1); }
  .tile.c-pos1 { background: var(--conf-pos1); } .tile.c-pos2 { background: var(--conf-pos2); }
  .tile.c-pos3 { background: var(--conf-pos3); }

  /* Kana chart rows, as in the Japanese Drill app: tap a row to select it. */
  .kana-ref-grid { display: flex; flex-direction: column; gap: 6px; }
  .kana-ref-row {
    display: flex; gap: 6px; border-radius: var(--radius); border: 1px solid transparent;
    padding: 4px; cursor: pointer; transition: all 0.15s; user-select: none;
    background: transparent; font-family: inherit; color: var(--text); width: 100%;
  }
  .kana-ref-row:hover { border-color: var(--border-hover); }
  .kana-ref-row.selected { border-color: var(--accent); background: var(--accent-dim); }
  .kana-ref-card {
    flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 4px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0;
  }
  .kana-ref-row.selected .kana-ref-card { background: transparent; border-color: transparent; }
  .kana-ref-card.empty { background: transparent; border-color: transparent; }
  .kana-ref-char { font-family: var(--jp); font-size: 28px; font-weight: 600; color: var(--text); line-height: 1; }
  .kana-ref-rom { font-size: 11px; font-weight: 600; color: var(--text-muted); }
  .group-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 0.875rem 1.25rem; display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; transition: border-color 0.15s; user-select: none; width: 100%;
    color: var(--text); font-family: inherit; text-align: left;
  }
  .group-card:hover { border-color: var(--border-hover); }
  .group-card.emphasis { border-color: var(--accent); }
  .group-card.selected { border-color: var(--accent); background: var(--accent-dim); }
  .group-name { font-size: 15px; font-weight: 700; }
  .group-arrow { font-size: 18px; color: var(--text-muted); }

  .btn-row { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 12px; border-radius: var(--radius); border: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .btn:hover { border-color: var(--border-hover); background: var(--surface2); }
  .screen > .btn { flex: none; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  .btn-primary:hover { opacity: 0.88; background: var(--accent); }
  .btn-hint { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
  .btn-hint:hover { border-color: var(--accent); background: var(--accent-dim); }
  .btn:disabled { opacity: 0.35; cursor: default; }

  .progress-wrap { display: flex; align-items: center; gap: 12px; }
  .progress-bg { flex: 1; height: 3px; background: var(--surface2); border-radius: 99px; }
  .progress-fill { height: 3px; border-radius: 99px; background: var(--accent); transition: width 0.3s; }
  .progress-label { font-size: 12px; font-weight: 600; color: var(--text-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .card {
    position: relative; background: var(--surface); border: 1.5px solid var(--card-border);
    border-radius: var(--radius-lg); padding: 1.25rem 1.25rem 1.25rem;
    display: flex; flex-direction: column; gap: 0.75rem;
  }
  .back-head { display: flex; align-items: center; gap: 1rem; }
  .k-mid { font-family: var(--jp); font-size: 56px; line-height: 1; min-width: 56px; text-align: center; }
  .k-mid.hidden-k { color: var(--text-dim); }
  .back-head .m { font-size: 18px; font-weight: 700; }
  .back-head .strokes { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .sec { border-top: 1px solid var(--border); padding-top: 0.55rem; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; }
  .sec-t { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-dim); }
  .rd { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .rd-item { font-size: 15px; font-family: var(--jp); }
  .rd-item small { font-family: -apple-system, sans-serif; font-size: 12px; color: var(--text-muted); margin-left: 4px; }
  .rd-item.on small { text-transform: uppercase; }
  .no-romaji .rd-item small { display: none; }
  .none { font-size: 13px; color: var(--text-dim); }

  .board-wrap { width: 100%; max-width: 340px; margin: 0 auto; }
  #board {
    display: block; width: 100%; height: auto; aspect-ratio: 1; max-width: 100%;
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
    touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair;
  }
  #board.locked { cursor: default; }
  .guide { stroke: var(--guide); stroke-width: 0.5; stroke-dasharray: 2 2; fill: none; }
  .stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 4.2; }
  .ghost { stroke: var(--ghost); }
  .ink { stroke: var(--text); }
  .done { stroke: var(--text); transition: stroke 0.6s ease; }
  .done.fresh { stroke: var(--green); transition: none; }
  .bad { stroke: var(--red); transition: opacity 0.45s ease 0.15s; }
  .bad.fade { opacity: 0; }
  .hint { stroke: var(--accent); }
  .hint-faint { stroke: var(--accent); opacity: 0.35; }
  .num { fill: var(--text-dim); font-size: 7px; font-weight: 700; font-family: -apple-system, sans-serif; }
  .num.hl { fill: var(--accent); }

  .feedback { min-height: 20px; font-size: 14px; font-weight: 600; text-align: center; color: var(--text-muted); }
  .feedback.good { color: var(--green); }
  .feedback.bad-msg { color: var(--red); }
  .feedback.info { color: var(--accent); }

  .stack { display: flex; flex-direction: column; gap: 8px; }
  .setting {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 0.85rem 1.1rem; cursor: pointer; user-select: none; color: var(--text); font-family: inherit; text-align: left; width: 100%;
  }
  .setting.static { cursor: default; flex-direction: column; align-items: stretch; }
  .setting .n { font-size: 15px; font-weight: 700; } .setting .d { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .toggle { width: 40px; height: 22px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--border); position: relative; flex-shrink: 0; }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-dim); transition: all 0.2s; }
  .setting.on .toggle { background: var(--accent); border-color: var(--accent); }
  .setting.on .toggle::after { left: 21px; background: var(--on-accent); }
  .credit { font-size: 11.5px; color: var(--text-dim); text-align: center; line-height: 1.5; }
  .credit a { color: var(--text-muted); }

  @media (prefers-reduced-motion: reduce) {
    .done, .bad, .progress-fill, .toggle::after { transition: none; }
  }
</style>
</head>
<body>
<header>
  <div class="app-heading"><span>漢字</span> strokes</div>
  <div class="nav-row">
    <button class="settings-btn" id="gear" title="Settings" aria-label="Settings">⚙</button>
    <div class="nav-pills" id="nav-pills">
      <button class="nav-pill" data-set="hira" id="nav-hira">ひらがな</button>
      <button class="nav-pill" data-set="kata" id="nav-kata">カタカナ</button>
      <button class="nav-pill" data-set="kanji" id="nav-kanji">漢字</button>
    </div>
  </div>
</header>

<main id="main">
  <!-- Home: choose what to practise, then the starting step -->
  <div class="screen visible" id="screen-home">
    <div class="title" id="home-title"></div>
    <div class="sub" id="home-sub"></div>

    <div class="stack" id="kana-select">
      <button class="group-card emphasis" id="select-all"><span class="group-name" id="select-all-label"></span><span class="group-arrow">→</span></button>
      <div class="kana-ref-grid" id="kana-grid"></div>
    </div>

    <div class="stack" id="kanji-select">
      <div class="section-label">Pick a set of pages</div>
      <div class="pill-row" id="group-pills"></div>
    </div>

    <div class="stack" id="start-block">
      <div class="section-label">Start each character at</div>
      <div class="pill-row" id="mode-pills">
        <button class="pill" data-mode="watch" id="mode-watch">Watch</button>
        <button class="pill" data-mode="trace" id="mode-trace">Trace</button>
        <button class="pill" data-mode="recall" id="mode-recall">Recall</button>
      </div>
      <div class="mode-desc" id="mode-desc"></div>
      <button class="btn btn-primary" id="start-btn"></button>
    </div>
  </div>

  <!-- Kanji selection: one set of pages, pick pages or single kanji -->
  <div class="screen" id="screen-kselect">
    <button class="btn" id="kselect-back">← All pages</button>
    <div class="title" id="group-title"></div>
    <div class="sub" id="kselect-sub"></div>
    <div class="btn-row">
      <button class="btn" id="kselect-all">Select all</button>
      <button class="btn" id="kselect-clear">Clear</button>
    </div>
    <div id="kgrid"></div>
    <div id="kselect-slot"></div>
  </div>

  <!-- Drill: one kanji at a time -->
  <div class="screen" id="screen-drill">
    <div class="progress-wrap">
      <div class="progress-bg"><div class="progress-fill" id="prog" style="width:0%"></div></div>
      <div class="progress-label" id="prog-label"></div>
    </div>
    <div class="pill-row step-pills" id="step-pills">
      <button class="pill" data-step="watch" id="step-watch">Watch</button>
      <button class="pill" data-step="trace" id="step-trace">Trace</button>
      <button class="pill" data-step="recall" id="step-recall">Recall</button>
    </div>
    <div class="card">
      <div class="back-head">
        <div class="k-mid" id="p-char"></div>
        <div>
          <div class="m" id="p-m"></div>
          <div class="strokes" id="p-strokes"></div>
        </div>
      </div>
      <div class="sec" id="p-readings">
        <span class="sec-t">On</span><div class="rd" id="p-on"></div>
        <span class="sec-t">Kun</span><div class="rd" id="p-kun"></div>
      </div>
      <div class="board-wrap">
        <svg id="board" viewBox="0 0 109 109" aria-label="Drawing area">
          <line class="guide" x1="54.5" y1="0" x2="54.5" y2="109"></line>
          <line class="guide" x1="0" y1="54.5" x2="109" y2="54.5"></line>
          <g id="g-ghost"></g><g id="g-done"></g><g id="g-hint"></g><g id="g-ink"></g><g id="g-nums"></g>
        </svg>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="btn-row" id="controls"></div>
    <button class="btn" id="back-btn">← Back to cards</button>
  </div>

  <!-- Settings -->
  <div class="screen" id="screen-settings">
    <div class="title">Settings</div>
    <div class="sub">Everything is stored on this device only.</div>
    <div class="setting static">
      <div><div class="n">Stroke checking</div><div class="d" id="len-desc"></div></div>
      <div class="pill-row" id="len-pills" style="justify-content:flex-start; margin-top:0.6rem;">
        <button class="pill" data-len="strict" id="len-strict">Strict</button>
        <button class="pill" data-len="normal" id="len-normal">Normal</button>
        <button class="pill" data-len="relaxed" id="len-relaxed">Relaxed</button>
      </div>
    </div>
    <button class="setting" id="set-theme"><div><div class="n">Light theme</div><div class="d">Switches from the default dark look</div></div><div class="toggle"></div></button>
    <button class="setting" id="set-romaji"><div><div class="n">Show romaji</div><div class="d">Romaji next to the readings</div></div><div class="toggle"></div></button>
    <button class="btn" id="settings-back">← Back</button>
    <p class="credit">Stroke order data from <a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a> © Ulrich Apel, CC BY-SA 3.0.</p>
  </div>

/* ---------- storage (best effort) ---------- */
function load(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
/* ---------- scoring (recorded, not shown yet) ----------
   Only COLD recall counts towards a score: Recall on a kanji you haven't just
   watched or traced in this visit. Recall straight after Watch/Trace, or a
   second go after finishing, is logged as warm practice and ignored.
   Mistakes are kept by type so they can be weighted later. Order, direction
   and hints are memory errors; shape misses are mostly drawing, so they
   count for little.
   Stored per character id (kanji card number, or h:/k: plus the kana): { cold: {tries, clean}, log: [last 20 attempts] }. */
const SCORE_KEY = 'kanjiStrokes.scores.v1';
const SCORE_WEIGHTS = { order: 1, dir: 1, hint: 1, shape: 0.25 };
const LOG_MAX = 20;
const scores = load(SCORE_KEY, {});
function memoryErrors(e) { return e.order * SCORE_WEIGHTS.order + e.dir * SCORE_WEIGHTS.dir + e.hint * SCORE_WEIGHTS.hint + e.shape * SCORE_WEIGHTS.shape; }
function recordAttempt(n, e, cold) {
  const rec = scores[n] || { cold: { tries: 0, clean: 0 }, log: [] };
  rec.log.push({ t: Date.now(), cold, order: e.order, dir: e.dir, shape: e.shape, hint: e.hint });
  if (rec.log.length > LOG_MAX) rec.log = rec.log.slice(-LOG_MAX);
  if (cold) { rec.cold.tries++; if (e.order + e.dir + e.hint === 0) rec.cold.clean++; }
  scores[n] = rec; save(SCORE_KEY, scores);
}
const settings = Object.assign({ set: 'hira', rows: { hira: [], kata: [] }, mode: 'watch', len: 'normal', romaji: true, light: false }, load(STORE_KEY + '.settings', {}));
// Earlier builds saved the drill's last step as the home choice, which could
// leave it stuck on Recall. Reset that once.
if (settings.v !== 2) { settings.mode = 'watch'; settings.v = 2; }
if (!['hira', 'kata', 'kanji'].includes(settings.set)) settings.set = 'hira';   // older builds stored a set id here
const saveSettings = () => save(STORE_KEY + '.settings', settings);
// Always set explicitly, so the page stays dark unless Light theme is switched on.
function applyTheme() { document.documentElement.setAttribute('data-theme', settings.light ? 'light' : 'dark'); }

/* ---------- geometry ---------- */
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function polyLength(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += dist(pts[i - 1], pts[i]); return L; }

function resample(pts, n) {
  const total = polyLength(pts);
  if (total === 0) return Array.from({ length: n }, () => pts[0].slice());
  const step = total / (n - 1), out = [pts[0].slice()];
  let acc = 0, i = 1, prev = pts[0];
  while (out.length < n - 1 && i < pts.length) {
    const seg = dist(prev, pts[i]);
    if (acc + seg >= step) {
      const t = (step - acc) / seg;
      const p = [prev[0] + t * (pts[i][0] - prev[0]), prev[1] + t * (pts[i][1] - prev[1])];
      out.push(p); prev = p; acc = 0;
    } else { acc += seg; prev = pts[i]; i++; }
  }
  while (out.length < n) out.push(pts[pts.length - 1].slice());
  return out;
}

// Sample every reference stroke once, using the browser's own path maths.
const sampler = document.createElementNS(NS, 'svg');
sampler.setAttribute('width', '0'); sampler.setAttribute('height', '0');
sampler.style.position = 'absolute'; sampler.style.visibility = 'hidden';
document.body.appendChild(sampler);
SETS.forEach(set => set.items.forEach(k => {
  k.set = set;
  k.pts = k.s.map(d => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d); sampler.appendChild(p);
    const L = p.getTotalLength(), arr = [];
    for (let i = 0; i < N; i++) { const q = p.getPointAtLength(L * i / (N - 1)); arr.push([q.x, q.y]); }
    p.remove();
    return arr;
  });
}));

function judge(user, ref) {
  const f = LENIENCY[settings.len];
  let fwd = 0, rev = 0;
  for (let i = 0; i < N; i++) { fwd += dist(user[i], ref[i]); rev += dist(user[i], ref[N - 1 - i]); }
  fwd /= N; rev /= N;
  if (fwd < TOL_AVG * f && dist(user[0], ref[0]) < TOL_END * f && dist(user[N - 1], ref[N - 1]) < TOL_END * f) return 'ok';
  if (rev < TOL_AVG * f && dist(user[0], ref[N - 1]) < TOL_END * f && dist(user[N - 1], ref[0]) < TOL_END * f) return 'reversed';
  return 'miss';
}

/* ---------- state ---------- */
const state = { mode: 'watch', idx: 0, stroke: 0, errs: null, warm: false, strokeMisses: 0, complete: false, token: 0, drawing: null };
// The drill works through state.list: the selected kana rows, or a kanji page.
state.list = [];
const kanaSet = id => SETS.find(s => s.id === id);
const kanjiPages = () => SETS.filter(s => s.type === 'kanji');
// Page groups, as in kanji-cards: five pages per pill, worked out from
// however many pages exist.
const PAGES_PER_GROUP = 5;
function kanjiGroups() {
  const pages = kanjiPages(), groups = [];
  for (let i = 0; i < pages.length; i += PAGES_PER_GROUP) {
    const ps = pages.slice(i, i + PAGES_PER_GROUP);
    const a = ps[0].label, b = ps[ps.length - 1].label;
    groups.push({ label: ps.length > 1 ? 'Page ' + a + '–' + b : 'Page ' + a, pages: ps, items: ps.flatMap(p => p.items) });
  }
  return groups;
}
const kSel = new Set();      // selected kanji ids on the selection screen
let kGroup = 0;
const ITEMS = () => state.list;
const cur = () => state.list[state.idx];
// Kana rows come straight from the chart layout, five cells per row.
function kanaRows(set) {
  const rows = [];
  for (let i = 0; i < set.layout.length; i += 5) rows.push(set.layout.slice(i, i + 5));
  return rows;
}
function selectedKana(set) {
  const chosen = settings.rows[set.id] || [];
  return kanaRows(set).flatMap((row, r) => chosen.includes(r) ? row.filter(i => i !== null).map(i => set.items[i]) : []);
}

/* ---------- small helpers ---------- */
const clear = g => { while (g.firstChild) g.firstChild.remove(); };
const wait = ms => new Promise(r => setTimeout(r, ms));
const shortMeaning = m => m.split(/[;,]/)[0];
function mkPath(d, cls, parent) {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d); p.setAttribute('class', 'stroke ' + cls);
  parent.appendChild(p); return p;
}
function mkNum(i, hl) {
  const [x, y] = cur().p[i];
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', x); t.setAttribute('y', y);
  t.setAttribute('class', 'num' + (hl ? ' hl' : ''));
  t.textContent = i + 1; gNums.appendChild(t); return t;
}
function animateStroke(p) {
  const L = p.getTotalLength();
  const ms = REDUCED ? 0 : Math.round(220 + L * 7);
  p.style.strokeDasharray = L + ' ' + L;
  p.style.strokeDashoffset = L;
  p.getBoundingClientRect();
  p.style.transition = 'stroke-dashoffset ' + ms + 'ms cubic-bezier(.45,.05,.55,.95)';
  p.style.strokeDashoffset = 0;
  return wait(ms + 60);
}
function btn(label, cls, id, fn) {
  const b = document.createElement('button');
  b.className = 'btn' + (cls ? ' ' + cls : ''); b.id = id; b.textContent = label; b.onclick = fn;
  return b;
}
function feedback(msg, cls) { const f = $('feedback'); f.textContent = msg; f.className = 'feedback' + (cls ? ' ' + cls : ''); }

/* ---------- screens ---------- */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('visible', s.id === id));
  $('gear').classList.toggle('active', id === 'screen-settings');
  if (id !== 'screen-drill') state.token++;       // stop any running animation
  window.scrollTo(0, 0);
}

function renderHome() {
  document.querySelectorAll('#nav-pills .nav-pill').forEach(b => b.classList.toggle('active', b.dataset.set === settings.set));
  renderStartBlock($('screen-home'));
  const isKana = settings.set !== 'kanji';
  $('kana-select').hidden = !isKana;
  $('kanji-select').hidden = isKana;
  $('start-block').hidden = !isKana;
  if (isKana) renderKanaHome(kanaSet(settings.set)); else renderKanjiHome();
}

function renderKanaHome(set) {
  $('home-title').textContent = set.label;
  $('home-sub').textContent = 'Tap a row to select it for practice.';
  const chosen = settings.rows[set.id] = settings.rows[set.id] || [];
  const rows = kanaRows(set);
  const grid = $('kana-grid'); clear(grid);
  rows.forEach((row, r) => {
    const el = document.createElement('button');
    el.className = 'kana-ref-row' + (chosen.includes(r) ? ' selected' : '');
    el.id = 'row-' + r;
    row.forEach(i => {
      const c = document.createElement('div');
      if (i === null) { c.className = 'kana-ref-card empty'; el.appendChild(c); return; }
      c.className = 'kana-ref-card';
      c.innerHTML = '<span class="kana-ref-char"></span><span class="kana-ref-rom"></span>';
      c.firstChild.textContent = set.items[i].k; c.lastChild.textContent = set.items[i].m;
      el.appendChild(c);
    });
    el.onclick = () => {
      const at = chosen.indexOf(r);
      if (at >= 0) chosen.splice(at, 1); else chosen.push(r);
      chosen.sort((a, b) => a - b); saveSettings(); renderHome();
    };
    grid.appendChild(el);
  });
  const all = chosen.length === rows.length;
  $('select-all-label').textContent = (all ? 'Deselect all' : 'Select all') + ' — ' + set.label;
  $('select-all').classList.toggle('selected', all);
  $('select-all').onclick = () => { settings.rows[set.id] = all ? [] : rows.map((_, r) => r); saveSettings(); renderHome(); };
  const n = selectedKana(set).length;
  $('start-btn').textContent = n ? 'Practise ' + n + (n === 1 ? ' character' : ' characters') : 'Select some rows first';
  $('start-btn').disabled = n === 0;
  $('start-btn').onclick = () => openDrill(selectedKana(set), 0);
}

// The step pills and Start button live in one block that moves to whichever
// selection screen is showing.
function renderStartBlock(parent) {
  if ($('start-block').parentElement !== parent) parent.appendChild($('start-block'));
  $('start-block').hidden = false;
  document.querySelectorAll('#mode-pills .pill').forEach(b => b.classList.toggle('active', b.dataset.mode === settings.mode));
  $('mode-desc').textContent = MODE_DESC[settings.mode];
}

function renderKanjiHome() {
  $('home-title').textContent = 'Kanji';
  $('home-sub').textContent = kanjiPages().length * 15 + ' kanji so far, in pages of 15.';
  const gp = $('group-pills'); clear(gp);
  kanjiGroups().forEach((g, i) => {
    const b = document.createElement('button');
    b.className = 'pill'; b.id = 'group-' + i;
    b.textContent = g.label + ' (' + g.items.length + ')';
    b.onclick = () => { kGroup = i; kSel.clear(); renderKSelect(); show('screen-kselect'); };
    gp.appendChild(b);
  });
}

function renderKSelect() {
  const g = kanjiGroups()[kGroup];
  $('group-title').textContent = 'Kanji · ' + g.label;
  $('kselect-sub').textContent = g.items.length + ' kanji in this set · tap kanji to pick them, or tap a page heading';
  const all = g.items.every(k => kSel.has(k.id));
  $('kselect-all').textContent = all ? 'Deselect all' : 'Select all';
  $('kselect-all').onclick = () => { g.items.forEach(k => all ? kSel.delete(k.id) : kSel.add(k.id)); renderKSelect(); };
  $('kselect-clear').onclick = () => { kSel.clear(); renderKSelect(); };
  const wrap = $('kgrid'); clear(wrap);
  g.pages.forEach(page => {
    const head = document.createElement('button');
    head.className = 'page-head'; head.id = 'head-' + page.id;
    head.innerHTML = '<span></span><span>tap to select page</span>';
    head.firstChild.textContent = page.head;
    head.onclick = () => {
      const whole = page.items.every(k => kSel.has(k.id));
      page.items.forEach(k => whole ? kSel.delete(k.id) : kSel.add(k.id));
      renderKSelect();
    };
    wrap.appendChild(head);
    const tiles = document.createElement('div');
    tiles.className = 'tile-grid';
    page.items.forEach(k => {
      const t = document.createElement('button');
      t.className = 'tile' + (kSel.has(k.id) ? ' selected' : ''); t.id = 'tile-' + k.id;
      t.innerHTML = '<div class="tk"></div><div class="tm"></div>';
      t.querySelector('.tk').textContent = k.k;
      t.querySelector('.tm').textContent = shortMeaning(k.m);
      t.onclick = () => { kSel.has(k.id) ? kSel.delete(k.id) : kSel.add(k.id); renderKSelect(); };
      tiles.appendChild(t);
    });
    wrap.appendChild(tiles);
  });
  renderStartBlock($('kselect-slot'));
  const chosen = g.items.filter(k => kSel.has(k.id));
  $('start-btn').textContent = chosen.length ? 'Start · ' + chosen.length + ' kanji' : 'Pick some kanji first';
  $('start-btn').disabled = chosen.length === 0;
  $('start-btn').onclick = () => openDrill(chosen, 0);
}

function setMode(m) { settings.mode = m; saveSettings(); }

/* ---------- drill ---------- */
// Each kanji begins at the starting step chosen on the home screen.
function openDrill(list, i) { state.from = $('screen-kselect').classList.contains('visible') ? 'kselect' : 'home'; state.list = list.slice(); state.idx = i; state.mode = settings.mode; state.warm = false; show('screen-drill'); start(); }
function goStep(m) { state.mode = m; start(); }

function renderReadings(el, list, cls) {
  clear(el);
  if (!list.length) { const s = document.createElement('span'); s.className = 'none'; s.textContent = 'none'; el.appendChild(s); return; }
  list.forEach(([kana, rom]) => {
    const s = document.createElement('span'); s.className = 'rd-item ' + cls; s.textContent = kana;
    if (rom) { const sm = document.createElement('small'); sm.textContent = rom; s.appendChild(sm); }
    el.appendChild(s);
  });
}

function renderCard() {
  const k = cur(), hide = state.mode === 'recall' && !state.complete;
  $('p-char').textContent = hide ? '？' : k.k;
  $('p-char').classList.toggle('hidden-k', hide);
  $('p-m').textContent = k.m;
  const kana = k.set.type === 'kana';
  $('p-strokes').textContent = k.s.length + (k.s.length === 1 ? ' stroke' : ' strokes') + ' · ' + (kana ? k.set.label : 'card ' + k.n);
  $('p-readings').hidden = kana;
  if (kana) return finishCardRender();
  renderReadings($('p-on'), k.on, 'on');
  renderReadings($('p-kun'), k.kun, 'kun');
  finishCardRender();
}
function finishCardRender() {
  document.querySelectorAll('#step-pills .pill').forEach(b => b.classList.toggle('active', b.dataset.step === state.mode));
  document.body.classList.toggle('no-romaji', !settings.romaji);
}

function renderProgress() {
  const total = cur().s.length;
  $('prog').style.width = (state.stroke / total * 100) + '%';
  $('prog-label').textContent = 'Card ' + (state.idx + 1) + ' of ' + ITEMS().length + ' · stroke ' + state.stroke + '/' + total;
}

function renderControls() {
  const c = $('controls'); clear(c);
  const isLast = state.idx === ITEMS().length - 1;
  if (state.mode === 'watch') {
    c.append(btn('Replay', '', 'act-replay', start),
             btn('Trace it', 'btn-primary', 'act-trace', () => goStep('trace')));
  } else if (state.complete) {
    const next = state.mode === 'trace'
      ? btn('Now from memory', 'btn-primary', 'act-next', () => goStep('recall'))
      : btn(isLast ? 'Back to cards' : 'Next', 'btn-primary', 'act-next', isLast ? goBack : nextKanji);
    c.append(btn('Again', '', 'act-again', start), next);
  } else {
    c.append(btn('Hint', 'btn-hint', 'act-hint', () => hint(true)),
             btn('Start over', '', 'act-restart', start));
  }
}

function nextKanji() { state.idx = Math.min(state.idx + 1, ITEMS().length - 1); state.mode = settings.mode; state.warm = false; start(); }
function goHome() { renderHome(); show('screen-home'); }
// Back from a drill goes to wherever it was started from.
function goBack() { if (state.from === 'kselect') { renderKSelect(); show('screen-kselect'); } else goHome(); }

async function start() {
  const token = ++state.token;
  state.stroke = 0; state.strokeMisses = 0; state.complete = false;
  state.errs = { order: 0, dir: 0, shape: 0, hint: 0 };
  if (state.mode !== 'recall') state.warm = true;   // seeing it drawn makes any recall that follows warm
  cancelInk();
  [gGhost, gDone, gHint, gInk, gNums].forEach(clear);
  renderCard(); renderProgress(); renderControls();
  const k = cur();

  if (state.mode === 'trace') k.s.forEach(d => mkPath(d, 'ghost', gGhost));

  if (state.mode === 'watch') {
    board.classList.add('locked');
    feedback('Watch the order', 'info');
    k.s.forEach(d => mkPath(d, 'ghost', gGhost));
    await wait(REDUCED ? 0 : 350);
    for (let i = 0; i < k.s.length; i++) {
      if (token !== state.token) return;
      const p = mkPath(k.s[i], 'done', gDone);
      mkNum(i, true);
      state.stroke = i + 1; renderProgress();
      await animateStroke(p);
      if (token !== state.token) return;
      gNums.lastChild.setAttribute('class', 'num');
    }
    feedback('Replay it, or try tracing', '');
  } else {
    board.classList.remove('locked');
    feedback(state.mode === 'trace' ? 'Trace stroke 1 over the grey guide' : 'Write it from memory. Stroke 1', '');
  }
}

async function hint(manual) {
  if (state.mode === 'watch' || state.complete) return;
  const token = state.token, i = state.stroke;
  state.errs.hint++;
  clear(gHint);
  const p = mkPath(cur().s[i], 'hint', gHint);
  await animateStroke(p);
  if (token !== state.token || state.stroke !== i) return;
  p.setAttribute('class', 'stroke hint-faint');
}

function finish() {
  state.complete = true;
  board.classList.add('locked');
  clear(gHint);
  cur().s.forEach((_, i) => mkNum(i, false));
  const e = state.errs;
  if (state.mode === 'recall') { recordAttempt(cur().id, e, !state.warm); state.warm = true; }
  renderCard(); renderControls();
  const parts = [];
  if (e.order) parts.push(e.order + ' out of order');
  if (e.dir) parts.push(e.dir + ' wrong direction');
  if (e.hint) parts.push(e.hint + (e.hint === 1 ? ' hint' : ' hints'));
  if (e.shape) parts.push(e.shape + ' redrawn');
  if (!parts.length) feedback(state.mode === 'recall' ? 'Clean from memory' : 'Traced with no mistakes', 'good');
  else feedback('Done: ' + parts.join(', '), 'info');
}

function accept(i) {
  const p = mkPath(cur().s[i], 'done fresh', gDone);
  requestAnimationFrame(() => requestAnimationFrame(() => p.classList.remove('fresh')));
  clear(gHint);
  state.stroke = i + 1; state.strokeMisses = 0;
  renderProgress();
  if (state.stroke === cur().s.length) finish();
  else feedback('Good. Stroke ' + (state.stroke + 1) + ' next', 'good');
}

function reject(path, msg, type) {
  state.errs[type]++; state.strokeMisses++;
  path.setAttribute('class', 'stroke bad');
  requestAnimationFrame(() => requestAnimationFrame(() => path.classList.add('fade')));
  setTimeout(() => path.remove(), 700);
  feedback(msg, 'bad-msg');
  // Recall shows the stroke after two misses on it; trace already has the guide.
  if (state.mode === 'recall' && state.strokeMisses === 2) hint(false);
}

function evaluate(raw, path) {
  const k = cur(), i = state.stroke;
  if (polyLength(raw) < 3) { path.remove(); return; }
  const user = resample(raw, N);
  const verdict = judge(user, k.pts[i]);
  if (verdict === 'ok') { path.remove(); accept(i); return; }
  if (verdict === 'reversed') { reject(path, 'Right place, wrong direction', 'dir'); return; }
  for (let j = i + 1; j < k.pts.length; j++) {
    if (judge(user, k.pts[j]) === 'ok') { reject(path, 'That is stroke ' + (j + 1) + '. Stroke ' + (i + 1) + ' comes first', 'order'); return; }
  }
  reject(path, 'Not quite. Try stroke ' + (i + 1) + ' again', 'shape');
}

/* ---------- pointer input ---------- */
function toSvg(e) {
  const pt = board.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const q = pt.matrixTransform(board.getScreenCTM().inverse());
  return [q.x, q.y];
}
function cancelInk() { if (state.drawing) { state.drawing.path.remove(); state.drawing = null; } }
const toD = pts => 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L');

board.addEventListener('pointerdown', e => {
  if (state.mode === 'watch' || state.complete || state.drawing) return;
  e.preventDefault();
  board.setPointerCapture(e.pointerId);
  const pts = [toSvg(e)];
  state.drawing = { id: e.pointerId, pts, path: mkPath(toD(pts), 'ink', gInk) };
});
board.addEventListener('pointermove', e => {
  const d = state.drawing;
  if (!d || e.pointerId !== d.id) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  (evs.length ? evs : [e]).forEach(ev => d.pts.push(toSvg(ev)));
  d.path.setAttribute('d', toD(d.pts));
});
function endStroke(e) {
  const d = state.drawing;
  if (!d || e.pointerId !== d.id) return;
  state.drawing = null;
  if (e.type === 'pointercancel') { d.path.remove(); return; }
  evaluate(d.pts, d.path);
}
board.addEventListener('pointerup', endStroke);
board.addEventListener('pointercancel', endStroke);

/* ---------- settings ---------- */
function renderSettings() {
  document.querySelectorAll('#len-pills .pill').forEach(b => b.classList.toggle('active', b.dataset.len === settings.len));
  $('len-desc').textContent = LEN_DESC[settings.len];
  $('set-romaji').classList.toggle('on', settings.romaji);
  $('set-theme').classList.toggle('on', settings.light);
}
let returnTo = 'screen-home';
$('gear').onclick = () => {
  if ($('screen-settings').classList.contains('visible')) { closeSettings(); return; }
  returnTo = (document.querySelector('.screen.visible') || {}).id || 'screen-home';
  renderSettings(); show('screen-settings');
};
function closeSettings() {
  if (returnTo === 'screen-drill') { show('screen-drill'); start(); }
  else if (returnTo === 'screen-kselect') { renderKSelect(); show('screen-kselect'); }
  else goHome();
}
$('settings-back').onclick = closeSettings;
document.querySelectorAll('#len-pills .pill').forEach(b => b.onclick = () => { settings.len = b.dataset.len; saveSettings(); renderSettings(); });
$('set-theme').onclick = () => { settings.light = !settings.light; saveSettings(); applyTheme(); renderSettings(); };
$('set-romaji').onclick = () => { settings.romaji = !settings.romaji; saveSettings(); renderSettings(); };

/* ---------- wiring ---------- */
document.querySelectorAll('#mode-pills .pill').forEach(b => b.onclick = () => {
  setMode(b.dataset.mode);
  if ($('screen-kselect').classList.contains('visible')) renderKSelect(); else renderHome();
});
document.querySelectorAll('#nav-pills .nav-pill').forEach(b => b.onclick = () => { settings.set = b.dataset.set; saveSettings(); goHome(); });
$('back-btn').onclick = goBack;
$('kselect-back').onclick = goHome;
document.querySelectorAll('#step-pills .pill').forEach(b => b.onclick = () => goStep(b.dataset.step));

renderHome();
</script>
</body>
</html>
